{% extends "base.html" %}
{% load static %}
{% block title %}言い訳裁判 - ログイン{% endblock %}
{% block content %}
<div class="phone-frame login-page">
  <div class="screen ornate-theme">

    <div class="ornate-logo-block">
      <!-- logo.pngは上下に大きな透明の余白(スパーク装飾のための余白)を含んでいて、
           小さく表示すると「ロゴの周りだけ妙に空いてる」ように見えてしまっていた。
           文字部分をタイトにクロップしたlogo_tight.pngに差し替えている -->
      <img src="{% static 'trial/img/logo_tight.png' %}" alt="言い訳裁判" />
      <div class="ornate-tagline">判決の時間です</div>
      <div class="ornate-sub">くだらないほど盛り上がる、模擬裁判エンタメ</div>
    </div>

    <!-- お名前は共通の入力欄を1つだけ持たせて、送信するフォーム(自由形式ホスト/
         ゲーム形式ホスト/参加者)を切り替えるときにJSでコピーする -->
    <div class="field">
      <label for="username-shared">お名前</label>
      <input type="text" id="username-shared" placeholder="例：たかし (10字以内) " value="{{ username|default:'' }}" maxlength="10" required />
    </div>

    {% if error %}
    <div class="ornate-error">
      {{ error }}
    </div>
    {% endif %}

    <div class="section-pad" style="padding-top: 14px; padding-bottom: 2px;">
      <div class="helper-text" style="margin-bottom: 6px;">はじめかたを選んでね</div>

      <!-- ホスト: 自由形式(今まで通り、被告人・制限時間を自分で決める) -->
      <form action="{% url 'enter' %}" method="post" class="host-form">
        {% csrf_token %}
        <input type="hidden" name="username" class="username-mirror" value="" />
        <input type="hidden" name="player_token" class="player-token-input" value="" />
        <input type="hidden" name="role" value="host" />
        <input type="hidden" name="mode" value="classic" />
        <button type="submit" class="ornate-card mode-classic">
          <div class="icon-circle tone-red">
            <i class="ti ti-gavel"></i>
          </div>
          <div>
            <div class="ornate-card-title">自由形式で開廷する</div>
            <div class="ornate-card-desc">被告人・制限時間を自分で決める、いつもの裁判</div>
          </div>
        </button>
      </form>

      <!-- ホスト: ゲーム形式(お題・被告人はランダム抽選、ベット/ランキングあり) -->
      <form action="{% url 'enter' %}" method="post" class="host-form">
        {% csrf_token %}
        <input type="hidden" name="username" class="username-mirror" value="" />
        <input type="hidden" name="player_token" class="player-token-input" value="" />
        <input type="hidden" name="role" value="host" />
        <input type="hidden" name="mode" value="game" />
        <button type="submit" class="ornate-card mode-game">
          <div class="icon-circle tone-gold">
            <i class="ti ti-dice-6"></i>
          </div>
          <div>
            <div class="ornate-card-title">ゲーム形式で開廷する</div>
            <div class="ornate-card-desc">お題・被告人はランダム抽選。ベット＆ランキングあり</div>
          </div>
        </button>
      </form>

      <!-- 参加者 -->
      <form action="{% url 'enter' %}" method="post" id="participant-form">
        {% csrf_token %}
        <input type="hidden" name="username" class="username-mirror" value="" />
        <input type="hidden" name="player_token" class="player-token-input" value="" />
        <input type="hidden" name="role" value="participant" />
        <div class="ornate-card mode-guest">
          <div class="ornate-card-row">
            <div class="icon-circle tone-bronze">
              <i class="ti ti-door-enter"></i>
            </div>
            <div class="ornate-card-body">
              <div class="ornate-card-title">参加者として参加する</div>
              <div class="ornate-card-desc">ホストから聞いた招待コードを入れてね</div>
            </div>
          </div>
          <input type="text" name="access_code" placeholder="招待コード（例：1234）" maxlength="4" />
          <button type="submit" class="btn-primary" style="margin-top: 8px; padding: 8px;">参加する</button>
        </div>
      </form>
    </div>

    <div style="height: 2px;"></div>
  </div>
</div>
<script>
  // このブラウザ用の匿名トークンを取得(無ければ発行して保存)し、全フォームに埋め込む。
  // メール登録などは一切不要で、同じブラウザ・同じ名前で入れば過去のポイントが続く。
  (function () {
    const STORAGE_KEY = "trial_player_token";
    let token = localStorage.getItem(STORAGE_KEY);
    if (!token) {
      token = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : "tok-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      localStorage.setItem(STORAGE_KEY, token);
    }
    document.querySelectorAll(".player-token-input").forEach((el) => { el.value = token; });
  })();

  // お名前欄は1つだけ表示して、送信するフォームに応じてコピーする
  const sharedUsername = document.getElementById("username-shared");
  function syncUsername() {
    document.querySelectorAll(".username-mirror").forEach((el) => { el.value = sharedUsername.value; });
  }
  sharedUsername.addEventListener("input", syncUsername);
  document.querySelectorAll("form").forEach((form) => {
    form.addEventListener("submit", (e) => {
      syncUsername();
      if (!sharedUsername.value.trim()) {
        e.preventDefault();
        sharedUsername.focus();
        alert("お名前を入力してください");
      }
    });
  });
</script>
{% endblock %}
