{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>言い訳裁判</title>
    <link rel="stylesheet" href="{% static 'trial/css/Login.css' %}">
</head>

<body>

<div class="background">

    <div class="card">

        <div class="logo"></div>

        <h1>言い訳裁判</h1>

        <p class="sub">
            くだらないほど盛り上がる、模擬裁判エンタメ
        </p>

        <div class="form">

            <label>お名前</label>

            <input
                type="text"
                placeholder="例：たかし"
            >

        </div>

        <p class="select">
            はじめかたを選んでね
        </p>

        <div class="mode active">

            <div class="icon red"></div>

            <div>

                <h2>ホストとして開廷する</h2>

                <p>裁判を作って参加者を招待する</p>

            </div>

        </div>

        <div class="mode">

            <div class="icon brown"></div>

            <div>

                <h2>参加者として参加する</h2>

                <p>招待コードを入力して入室する</p>

            </div>

        </div>

        <input
            class="code"
            type="text"
            placeholder="招待コードを入力（例：8391）"
        >

    </div>

</div>

</body>

</html>
